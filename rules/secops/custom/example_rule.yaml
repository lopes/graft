metadata:
  id: "c4e9b8f2-89b1-4f81-9b16-928d54128f73"
  name: "powershell_encoded_launch"
  description: "Detects execution of PowerShell commands using base64 encoded arguments."
  status: "production"
  priority: "high"
  authors:
    - "Security Engineering"
  mitre:
    execution:
      - "T1059.001"
  tags:
    - "windows"
    - "powershell"
    - "evasion"
  references:
    - "https://attack.mitre.org/techniques/T1059/001/"

logic: |
  events:
    $e.metadata.event_type = "PROCESS_LAUNCH"
    re.regex($e.target.process.command_line, `(?i)(?:-enc|-encodedcommand)\s+[A-Za-z0-9+/=]{10,}`)
  condition:
    $e

deployment:
  enabled: true
  alerting: true
  run_frequency: "live"

runbook:
  context: |
    Adversaries and red team operators frequently use encoded PowerShell commands
    (-enc / -encodedcommand) to obscure command-line arguments from static string
    signatures and endpoint inspection tools.
  triage: |
    1. Extract and base64-decode the encoded command-line string.
    2. Determine whether the command was executed by an approved administrative tool or deployment framework.
    3. Review surrounding process tree events for suspicious parent processes (e.g., cmd.exe, wscript.exe, office binaries).
    4. Check for child processes spawned by powershell.exe (e.g., whoami.exe, net.exe, certutil.exe).
  response: |
    1. If execution is unauthorized or malicious, immediately isolate the endpoint from the network.
    2. Terminate the offending process tree and revoke any active Kerberos or OAuth tokens associated with the user account.
    3. Collect process memory and prefetch artifacts for forensic examination.

tests:
  - id: "match_encoded_invocation"
    description: "Fires an alert when an encoded PowerShell invocation is observed"
    expect: 1
    events:
      - timestamp: "2026-09-17T12:00:00Z"
        payload:
          metadata:
            event_type: "PROCESS_LAUNCH"
          principal:
            hostname: "ws-corp-01"
            user:
              userid: "victim_user"
          target:
            process:
              command_line: "powershell.exe -enc SQBYAE0A..."
              file:
                full_path: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"

  - id: "ignore_standard_script"
    description: "Verifies no alert fires when PowerShell is executed with plain arguments"
    expect: 0
    events:
      - timestamp: "2026-09-17T12:05:00Z"
        payload:
          metadata:
            event_type: "PROCESS_LAUNCH"
          principal:
            hostname: "ws-corp-01"
            user:
              userid: "victim_user"
          target:
            process:
              command_line: "powershell.exe -ExecutionPolicy Bypass -File C:\\Scripts\\maintenance.ps1"
              file:
                full_path: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
