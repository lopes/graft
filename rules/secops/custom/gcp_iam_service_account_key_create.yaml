metadata:
  id: "d5e2a481-7f32-4019-86c2-19e34b719002"
  name: "gcp_iam_service_account_key_create"
  description: "User-managed GCP service account key created."
  status: "production"
  authors:
    - "Cloud Security Operations"
  mitre:
    persistence:
      - "T1098.001"
    privilege_escalation:
      - "T1098.001"
  tags:
    - "gcp"
    - "iam"
    - "cloud_audit"
    - "credentials"
    - "persistence"
  references:
    - "https://cloud.google.com/iam/docs/creating-managing-service-account-keys"

logic: |
  events:
    $e.metadata.event_type = "USER_RESOURCE_CREATION"
    $e.metadata.product_name = "GCP Cloud Audit"
    $e.metadata.product_event_type = "google.iam.admin.v1.CreateServiceAccountKey"
    $e.security_result.action = "ALLOW"
  condition:
    $e

deployment:
  enabled: true
  alerting: true
  run_frequency: "live"

runbook:
  context: "Service account keys are downloadable private key pairs providing persistent programmatic access to Google Cloud APIs. Compromised principals or malicious insiders frequently create service account keys to bypass identity provider MFA and maintain unmonitored persistence outside corporate network perimeter."
  triage: |
    1. Identify the caller principal creating the key and originating IP address.
    2. Review the target service account and its assigned IAM roles.
    3. Check corresponding change management tickets for authorized key generation.
    4. Verify if organization policy constraints/iam.disableServiceAccountKeyCreation is enforced.
  response: |
    1. Invalidate and delete the created service account key immediately.
    2. Rotate credentials for the calling identity if unauthorized activity is suspected.
    3. Audit Cloud Audit Logs for any API actions performed using the newly created key ID.

# EXPERIMENTAL - NOT WORKING
tests:
  - id: "match_service_account_key_creation"
    description: "Fires an alert when a user-managed service account key is created"
    expect: 1
    events:
      - timestamp: "2026-09-17T15:00:00Z"
        payload:
          metadata:
            event_type: "USER_RESOURCE_CREATION"
            product_name: "GCP Cloud Audit"
            product_event_type: "google.iam.admin.v1.CreateServiceAccountKey"
          principal:
            user:
              userid: "dev-operator@corp.example.com"
          target:
            resource:
              name: "projects/corp-prod/serviceAccounts/deployer@corp-prod.iam.gserviceaccount.com"
          security_result:
            action: "ALLOW"

  - id: "ignore_service_account_listing"
    description: "Verifies no alert fires on read-only service account queries"
    expect: 0
    events:
      - timestamp: "2026-09-17T15:05:00Z"
        payload:
          metadata:
            event_type: "USER_RESOURCE_ACCESS"
            product_name: "GCP Cloud Audit"
            product_event_type: "google.iam.admin.v1.ListServiceAccounts"
          principal:
            user:
              userid: "auditor@corp.example.com"
          security_result:
            action: "ALLOW"
