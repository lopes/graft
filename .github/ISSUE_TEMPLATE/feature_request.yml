name: Feature / Enhancement
description: Propose a new feature, engine adapter, or architectural improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap, limitation, or operational friction exists today, and why does solving it matter?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Architectural background, candidate approaches, affected files/ports, invariants, and any open questions to explore.
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Concrete deliverables, architectural contracts, and verification criteria required to close this issue.
      value: |
        - [ ] Design questions resolved and approach validated
        - [ ] Unit, engine contract, and adversarial tests added (TDD)
        - [ ] Documentation updated (`docs/` and co-located engine docs if applicable)
        - [ ] All verification gates pass (`ruff check`, `ruff format --check`, `mypy --strict`, `pytest`, `graft lint`)
    validations:
      required: true
