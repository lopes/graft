name: Deploy Production & Publish Catalogs

"on":
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to SecOps & Publish Value Artifacts
    runs-on: ubuntu-latest
    if: github.repository == 'lopes/graft'
    env:
      GRAFT_SECOPS_PROD_PROJECT: ${{ vars.GRAFT_SECOPS_PROD_PROJECT }}
      GRAFT_SECOPS_PROD_LOCATION: ${{ vars.GRAFT_SECOPS_PROD_LOCATION }}
      GRAFT_SECOPS_PROD_INSTANCE_ID: ${{ vars.GRAFT_SECOPS_PROD_INSTANCE_ID }}

    steps:
      - name: Checkout repository (full history for git blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Sanity check - Validate rules and manifests
        run: uv run graft lint

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GRAFT_SECOPS_WIF_PROVIDER }}
          service_account: ${{ secrets.GRAFT_SECOPS_PROD_SA_EMAIL }}

      - name: Apply GitOps desired state to Production SecOps tenant
        run: uv run graft secops apply --env production

      - name: Generate threat matrix and visibility catalogs
        run: |
          mkdir -p exports layers
          uv run graft export matrix --format navigator --out layers/attack_navigator_layer.json
          uv run graft export catalog --format markdown --out exports/ruleset_catalog.md
          uv run graft export catalog --format csv --out exports/ruleset_catalog.csv

      - name: Upload release & audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graft-governance-artifacts-${{ github.sha }}
          path: |
            layers/attack_navigator_layer.json
            exports/ruleset_catalog.md
            exports/ruleset_catalog.csv
          retention-days: 90
