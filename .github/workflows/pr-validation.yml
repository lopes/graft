name: PR Quality & Verification Gates

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-unit-gates:
    name: Offline Quality & Static Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Gate 1 - Code formatting (ruff)
        run: uv run ruff format --check .

      - name: Gate 2 - Code linting (ruff)
        run: uv run ruff check .

      - name: Gate 3 - Static type checking (mypy)
        run: uv run mypy --strict src tests

      - name: Gate 4 - Unit and engine test suite (pytest)
        run: uv run pytest tests/unit tests/engines

      - name: Gate 5 - Rules & manifests linting (schema + MITRE)
        run: uv run graft lint

  secops-cloud-gates:
    name: Google SecOps Verification Gates
    needs: [lint-and-unit-gates]
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      GRAFT_SECOPS_PROD_PROJECT: ${{ vars.GRAFT_SECOPS_PROD_PROJECT }}
      GRAFT_SECOPS_PROD_LOCATION: ${{ vars.GRAFT_SECOPS_PROD_LOCATION }}
      GRAFT_SECOPS_PROD_INSTANCE_ID: ${{ vars.GRAFT_SECOPS_PROD_INSTANCE_ID }}
      GRAFT_SECOPS_STAGING_PROJECT: ${{ vars.GRAFT_SECOPS_STAGING_PROJECT || vars.GRAFT_SECOPS_PROD_PROJECT }}
      GRAFT_SECOPS_STAGING_LOCATION: ${{ vars.GRAFT_SECOPS_STAGING_LOCATION || vars.GRAFT_SECOPS_PROD_LOCATION }}
      GRAFT_SECOPS_STAGING_INSTANCE_ID: ${{ vars.GRAFT_SECOPS_STAGING_INSTANCE_ID || vars.GRAFT_SECOPS_PROD_INSTANCE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.GRAFT_SECOPS_WIF_PROVIDER }}
          service_account: ${{ secrets.GRAFT_SECOPS_STAGING_SA_EMAIL || secrets.GRAFT_SECOPS_PROD_SA_EMAIL }}

      - name: Gate 6 - Chronicle verifyRuleText pre-merge compiler dry-run
        env:
          GRAFT_SECOPS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: uv run graft secops verify rules/secops/custom/

      - name: Gate 7 - Synthetic UDM replay test harness
        env:
          GRAFT_SECOPS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: uv run graft secops test

      - name: Gate 8 - GitOps managed content drift check
        id: managed_diff
        env:
          GRAFT_SECOPS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set +e
          DIFF_OUTPUT=$(uv run graft secops managed diff 2>&1)
          DIFF_EXIT=$?
          set -e
          echo "diff_exit=${DIFF_EXIT}" >> "$GITHUB_OUTPUT"
          
          # Write diff summary to file for PR comment
          cat <<EOF > diff_summary.md
          ### 🛡️ Graft GitOps Managed Content Plan

          \`\`\`text
          ${DIFF_OUTPUT}
          \`\`\`

          *Plan generated by \`graft secops managed diff\` targeting SecOps.*
          EOF

      - name: Post GitOps diff summary to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_HEADER="### 🛡️ Graft GitOps Managed Content Plan"
          PR_NUM="${{ github.event.pull_request.number }}"
          
          # Check for existing comment to update
          EXISTING_COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUM}/comments" \
            --jq ".[] | select(.body | startswith(\"${COMMENT_HEADER}\")) | .id" | head -n 1)

          if [ -n "${EXISTING_COMMENT_ID}" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
              -F body=@diff_summary.md
          else
            gh pr comment "${PR_NUM}" --body-file diff_summary.md
          fi
