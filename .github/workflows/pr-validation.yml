name: PR Quality & Verification Gates

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "src/**"
      - "datasets/**"
      - "rulesets/**"
      - "tests/**"
      - "docs/**"
      - "AGENTS.md"
      - ".agents/**"
      - ".githooks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-unit-gates:
    name: Offline Quality & Static Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Gate 1 - Code formatting (ruff)
        run: uv run ruff format --check .

      - name: Gate 2 - Code linting (ruff)
        run: uv run ruff check .

      - name: Gate 3 - Static type checking (mypy)
        run: uv run mypy --strict src tests

      - name: Gate 4 - Unit and engine test suite (pytest)
        run: uv run pytest tests/unit tests/engines

      - name: Gate 5 - Rules & manifests linting (schema + MITRE)
        run: uv run graft lint

      - name: Gate 5b - Offline GTI synthetic YARA-X test vectors
        run: uv run graft gti test

      - name: MITRE ATT&CK upstream release check (advisory)
        run: uv run graft mitre update --check || true

  secops-cloud-gates:
    name: Google SecOps Verification Gates
    needs: [lint-and-unit-gates]
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write
    env:
      GRAFT_SECOPS_PROD_PROJECT: ${{ vars.GRAFT_SECOPS_PROD_PROJECT }}
      GRAFT_SECOPS_PROD_LOCATION: ${{ vars.GRAFT_SECOPS_PROD_LOCATION }}
      GRAFT_SECOPS_PROD_INSTANCE_ID: ${{ vars.GRAFT_SECOPS_PROD_INSTANCE_ID }}
      GRAFT_SECOPS_STAGING_PROJECT: ${{ vars.GRAFT_SECOPS_STAGING_PROJECT }}
      GRAFT_SECOPS_STAGING_LOCATION: ${{ vars.GRAFT_SECOPS_STAGING_LOCATION }}
      GRAFT_SECOPS_STAGING_INSTANCE_ID: ${{ vars.GRAFT_SECOPS_STAGING_INSTANCE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Authenticate to Google Cloud Staging via Workload Identity Federation
        id: auth_staging
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.GRAFT_SECOPS_WIF_PROVIDER }}
          service_account: ${{ secrets.GRAFT_SECOPS_STAGING_SA_EMAIL || secrets.GRAFT_SECOPS_PROD_SA_EMAIL }}

      - name: Gate 6 - Chronicle verifyRuleText pre-merge compiler dry-run
        env:
          GRAFT_SECOPS_TOKEN: ${{ steps.auth_staging.outputs.access_token }}
        run: uv run graft secops verify --env staging

      - name: Gate 7 - Synthetic UDM replay test harness
        env:
          GRAFT_SECOPS_TOKEN: ${{ steps.auth_staging.outputs.access_token }}
        run: uv run graft secops test

      - name: Authenticate to Google Cloud Production via Workload Identity Federation
        id: auth_prod
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.GRAFT_SECOPS_WIF_PROVIDER }}
          service_account: ${{ secrets.GRAFT_SECOPS_PROD_SA_EMAIL || secrets.GRAFT_SECOPS_STAGING_SA_EMAIL }}

      - name: Gate 8 - GitOps scoped reconciliation plan
        id: secops_diff
        env:
          GRAFT_SECOPS_TOKEN: ${{ steps.auth_prod.outputs.access_token }}
        run: |
          set +e
          DIFF_OUTPUT=$(uv run graft secops diff --env production 2>&1)
          DIFF_EXIT=$?
          set -e
          echo "diff_exit=${DIFF_EXIT}" >> "$GITHUB_OUTPUT"

          if [ "${DIFF_EXIT}" -eq 1 ]; then
            echo "${DIFF_OUTPUT}" >&2
            exit 1
          fi

          # Write diff summary to file for PR comment
          {
            echo "### 🛡️ Graft GitOps Reconciliation Plan"
            echo ""
            echo '````text'
            echo "${DIFF_OUTPUT}"
            echo '````'
            echo ""
            echo "*Plan generated by \`graft secops diff\` targeting SecOps.*"
          } > diff_summary.md

      - name: Post GitOps diff summary to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_HEADER="### 🛡️ Graft GitOps Reconciliation Plan"

          # Check for existing comment to update
          EXISTING_COMMENT_ID=$(gh api --paginate "repos/${GH_REPO}/issues/${PR_NUM}/comments" \
            --jq ".[] | select(.body | startswith(\"${COMMENT_HEADER}\")) | .id" | head -n 1)

          if [ -n "${EXISTING_COMMENT_ID}" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
              -F body=@diff_summary.md
          else
            gh pr comment "${PR_NUM}" --body-file diff_summary.md
          fi

  gti-cloud-gates:
    name: Google Threat Intelligence Verification Gates
    needs: [lint-and-unit-gates]
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GRAFT_GTI_API_KEY: ${{ secrets.GRAFT_GTI_API_KEY }}
      GRAFT_GTI_STAGING_API_KEY: ${{ secrets.GRAFT_GTI_STAGING_API_KEY }}
      GRAFT_GTI_PROD_API_KEY: ${{ secrets.GRAFT_GTI_PROD_API_KEY }}
      GRAFT_GTI_FILTER: ${{ vars.GRAFT_GTI_FILTER || 'owner:self' }}
      GRAFT_GTI_NOTIFICATION_EMAILS: ${{ vars.GRAFT_GTI_NOTIFICATION_EMAILS }}

    steps:
      - name: Checkout repository
        if: env.GRAFT_GTI_API_KEY != '' || env.GRAFT_GTI_STAGING_API_KEY != '' || env.GRAFT_GTI_PROD_API_KEY != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        if: env.GRAFT_GTI_API_KEY != '' || env.GRAFT_GTI_STAGING_API_KEY != '' || env.GRAFT_GTI_PROD_API_KEY != ''
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        if: env.GRAFT_GTI_API_KEY != '' || env.GRAFT_GTI_STAGING_API_KEY != '' || env.GRAFT_GTI_PROD_API_KEY != ''
        run: uv python install 3.13

      - name: Install dependencies
        if: env.GRAFT_GTI_API_KEY != '' || env.GRAFT_GTI_STAGING_API_KEY != '' || env.GRAFT_GTI_PROD_API_KEY != ''
        run: uv sync --locked

      - name: Gate 6 - GTI server-side YARA-X compiler dry-run
        if: env.GRAFT_GTI_STAGING_API_KEY != '' || env.GRAFT_GTI_API_KEY != ''
        run: uv run graft gti verify

      - name: Gate 7 - GTI synthetic and Retrohunt replay test harness
        if: env.GRAFT_GTI_STAGING_API_KEY != '' || env.GRAFT_GTI_API_KEY != ''
        run: uv run graft gti test

      - name: Gate 8 - GTI GitOps scoped reconciliation plan
        id: gti_diff
        if: env.GRAFT_GTI_PROD_API_KEY != '' || env.GRAFT_GTI_API_KEY != ''
        run: |
          set +e
          DIFF_OUTPUT=$(uv run graft gti diff --env production 2>&1)
          DIFF_EXIT=$?
          set -e
          echo "diff_exit=${DIFF_EXIT}" >> "$GITHUB_OUTPUT"

          if [ "${DIFF_EXIT}" -eq 1 ]; then
            echo "${DIFF_OUTPUT}" >&2
            exit 1
          fi

          {
            echo "### 🛡️ Graft GTI GitOps Reconciliation Plan"
            echo ""
            echo '````text'
            echo "${DIFF_OUTPUT}"
            echo '````'
            echo ""
            echo "*Plan generated by \`graft gti diff\` targeting Google Threat Intelligence.*"
          } > gti_diff_summary.md

      - name: Post GTI GitOps diff summary to PR
        if: (env.GRAFT_GTI_PROD_API_KEY != '' || env.GRAFT_GTI_API_KEY != '') && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_HEADER="### 🛡️ Graft GTI GitOps Reconciliation Plan"

          EXISTING_COMMENT_ID=$(gh api --paginate "repos/${GH_REPO}/issues/${PR_NUM}/comments" \
            --jq ".[] | select(.body | startswith(\"${COMMENT_HEADER}\")) | .id" | head -n 1)

          if [ -n "${EXISTING_COMMENT_ID}" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
              -F body=@gti_diff_summary.md
          else
            gh pr comment "${PR_NUM}" --body-file gti_diff_summary.md
          fi
