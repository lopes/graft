[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[project]
name = "graft"
version = "0.1.0"
description = "Extensible Detection-as-Code platform for Google SecOps and modern enterprise security operations"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "Joe Lopes" },
]
keywords = [
    "detection-as-code",
    "secops",
    "chronicle",
    "siem",
    "yara-l",
    "mitre-attack",
    "gitops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/lopes/graft"
Repository = "https://github.com/lopes/graft"
Documentation = "https://github.com/lopes/graft/tree/main/docs"
Issues = "https://github.com/lopes/graft/issues"
Changelog = "https://github.com/lopes/graft/blob/main/CHANGELOG.md"

[project.scripts]
graft = "graft.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # isort
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (disallow print in production code)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # Allow assert statements and dummy credential values in tests

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "yaml",
    "jsonschema",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "integration: Live API integration tests (gated by --run-integration)",
    "replay: Dynamic replay tests against staging SecOps tenant",
]
