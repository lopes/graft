metadata:
  id: "8f14e45f-ceea-467a-a124-000000000001"
  name: "sso_login_portal_impersonated"
  description: "Detects newly observed URLs impersonating corporate SSO login portals outside sanctioned root domains"
  owners:
    - "Threat Intelligence"
    - "Detection Engineering"
  mitre:
    initial-access:
      - "T1566.002"
  tags:
    - "web"
    - "sso"
    - "phishing"
  references:
    - "https://gtidocs.virustotal.com/docs/url-hunting"
    - "https://attack.mitre.org/techniques/T1566/002/"

logic: |
  import "vt"

  condition:
    vt.net.url.new_url and
    not (
      vt.net.domain.root == "example.com" or
      vt.net.domain.root == "example.org"
    ) and
    (
      vt.net.url.raw icontains "login" or
      vt.net.url.raw icontains "signin"
    ) and
    vt.net.url.downloaded_file.analysis_stats.malicious >= 1

deployment:
  type: "livehunt"
  subtype: "url"
  enabled: true
  daily_limit: 100

runbook:
  context: |
    Adversaries register lookalike domains hosting credential harvesting portals that mimic enterprise SSO login flows. This Livehunt rule monitors GTI's incoming URL stream for newly observed URLs containing login or signin paths outside sanctioned corporate domains that also serve or redirect to malicious payloads.
  triage: |
    1. Inspect the matched URL (`vt.net.url.raw`) and root domain (`vt.net.domain.root`) in Google Threat Intelligence.
    2. Check WHOIS registration age, TLS certificate subject/issuer, and HTTP response title/DOM fingerprint.
    3. Search corporate DNS, proxy, and IdP authentication logs for any employee visits or token issuance to the domain.
  response: |
    1. Block the offending root domain and IP address at corporate DNS, secure web gateway, and email security perimeter.
    2. Revoke active sessions and rotate credentials for any user who interacted with the phishing URL.
    3. Submit takedown requests to the domain registrar and hosting provider.

tests:
  - id: "match_unlisted_sso_phishing_url"
    description: "Newly observed URL containing SSO login paths on an external domain triggers a match"
    expect: 1
    events:
      - timestamp: "2026-10-15T12:00:00Z"
        payload:
          vt.net.url.new_url: true
          vt.net.domain.root: "login-verify-portal.test"
          vt.net.url.raw: "https://login-verify-portal.test/sso/login?client_id=corp"
          vt.net.url.downloaded_file.analysis_stats.malicious: 3
  - id: "ignore_sanctioned_corporate_root_domain"
    description: "Sanctioned corporate root domain does not trigger a match"
    expect: 0
    events:
      - timestamp: "2026-10-15T12:05:00Z"
        payload:
          vt.net.url.new_url: true
          vt.net.domain.root: "example.com"
          vt.net.url.raw: "https://sso.example.com/login"
          vt.net.url.downloaded_file.analysis_stats.malicious: 3
