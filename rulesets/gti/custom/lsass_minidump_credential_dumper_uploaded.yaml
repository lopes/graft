metadata:
  id: "8f14e45f-ceea-467a-a124-000000000002"
  name: "lsass_minidump_credential_dumper_uploaded"
  description: "Retrohunt scan for Windows PE binaries combining LSASS process strings with MiniDumpWriteDump credential access APIs"
  owners:
    - "Threat Intelligence"
    - "Incident Response"
  mitre:
    credential-access:
      - "T1003.001"
  tags:
    - "gti"
    - "retrohunt"
    - "windows"
  references:
    - "https://gtidocs.virustotal.com/docs/retrohunt-overview"
    - "https://attack.mitre.org/techniques/T1003/001/"

logic: |
  import "vt"

  strings:
    $api_minidump = "MiniDumpWriteDump" ascii wide
    $dll_dbghelp = "dbghelp.dll" ascii wide nocase
    $proc_lsass = "lsass.exe" ascii wide nocase
    $priv_debug = "SeDebugPrivilege" ascii wide

  condition:
    vt.metadata.file_type == vt.FileType.PE_EXE and
    filesize < 5242880 and
    $api_minidump and
    $dll_dbghelp and
    $proc_lsass and
    $priv_debug

deployment:
  type: "retrohunt"
  enabled: false
  corpus: "main"
  start_time: "2026-01-01T00:00:00Z"
  end_time: "2026-03-31T23:59:59Z"

runbook:
  context: |
    Adversaries frequently build custom or modified Windows PE credential dumpers that enable SeDebugPrivilege, resolve MiniDumpWriteDump from dbghelp.dll, and dump LSASS process memory. This Retrohunt rule scans GTI's historical main corpus across a target UTC time window to discover newly uploaded or previously unseen variants.
  triage: |
    1. Review the Retrohunt job matches (`GET /api/v3/intelligence/retrohunt_jobs/{id}/matching_files`) in Google Threat Intelligence.
    2. Inspect PE Authenticode signatures, compilation timestamps, and PDB paths to filter out legitimate crash-reporting utilities.
    3. Pivot on common import hashes (imphash), sections, or submitter characteristics across matched samples.
  response: |
    1. Extract SHA-256 hashes of confirmed credential dumper variants and hunt across endpoint EDR telemetry.
    2. Isolate any host where a matched SHA-256 hash was executed or staged.
    3. Transition high-confidence YARA-X signatures into an active Livehunt file ruleset for continuous monitoring.

tests:
  - id: "match_lsass_minidump_pe_binary"
    description: "PE executable under 5MB containing LSASS minidump strings triggers a match"
    expect: 1
    events:
      - timestamp: "2026-10-15T12:00:00Z"
        payload:
          vt.metadata.file_type: "vt.FileType.PE_EXE"
          filesize: 204800
          sample_text: "MiniDumpWriteDump dbghelp.dll lsass.exe SeDebugPrivilege"
  - id: "ignore_non_lsass_crash_handler"
    description: "PE executable missing lsass.exe reference does not match"
    expect: 0
    events:
      - timestamp: "2026-10-15T12:05:00Z"
        payload:
          vt.metadata.file_type: "vt.FileType.PE_EXE"
          filesize: 204800
          sample_text: "MiniDumpWriteDump dbghelp.dll app_crash_reporter.exe"
