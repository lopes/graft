metadata:
  id: "8f14e45f-ceea-467a-a124-000000000006"
  name: "rh_corporate_secret_key_leak_swept"
  description: "Sweeps GTI historical corpus for scripts or text files exposing ACME Financial secrets or private keys"
  owners:
    - "Threat Intelligence"
    - "Detection Engineering"
  mitre:
    credential-access:
      - "T1552.001"
    exfiltration:
      - "T1567.002"
  tags:
    - "acme"
    - "credentials"
    - "data-leak"
    - "secrets"
  references:
    - "https://gtidocs.virustotal.com/docs/retrohunt-overview"
    - "https://attack.mitre.org/techniques/T1552/001/"
    - "https://attack.mitre.org/techniques/T1567/002/"

logic: |
  import "vt"

  strings:
    $key_password = "password" nocase
    $key_api = /api[_-]?key/ nocase
    $key_secret = "secret" nocase
    $key_token = "token" nocase
    $secret_hex = /[a-fA-F0-9]{32,64}/
    $secret_jwt = /eyJ[a-zA-Z0-9_-]{20,80}/
    $secret_private_key = /-----BEGIN (RSA |OPENSSH |EC )?PRIVATE[\x20]KEY-----/
    $org_domain_acme = "acme.com" nocase wide ascii
    $org_name_acme = "acme" fullword nocase wide ascii

  condition:
    // Cap scan size at 5MB and scope to script/config file types in the historical main corpus
    filesize < 5MB and
    (
      vt.metadata.file_type == vt.FileType.PYTHON or
      vt.metadata.file_type == vt.FileType.POWERSHELL or
      vt.metadata.file_type == vt.FileType.PHP or
      vt.metadata.file_type == vt.FileType.PERL or
      vt.metadata.file_type == vt.FileType.TEXT
    ) and
    any of ($org_*) and
    (any of ($key_*) or $secret_hex or $secret_jwt or $secret_private_key) and
    (vt.metadata.analysis_stats.malicious > 0 or vt.metadata.analysis_stats.undetected > 5)

deployment:
  type: "retrohunt"
  enabled: false
  corpus: "main"
  start_time: "2026-01-01T00:00:00Z"
  end_time: "2026-03-31T23:59:59Z"

runbook:
  context: |
    Adversaries harvesting developer workstations via infostealers, third-party contractors debugging automation scripts, or employees scanning configuration files occasionally upload Python, PowerShell, PHP, Perl, or text files to VirusTotal that contain hardcoded ACME Financial (`acme.com`) API keys, JSON Web Tokens (`eyJ...`), PEM private key headers, or service credentials (`T1552.001`, `T1567.002`). This Retrohunt rule sweeps GTI's historical `main` corpus for script and text artifacts under 5MB referencing `"acme.com"` or `"acme"` alongside credential keywords or secret structures. The rule is committed with `enabled: false` so it remains dormant in Git without consuming Retrohunt job quota during routine CI runs; flip `enabled: true` (or invoke a `mode: "retrohunt"` test vector) during quarterly credential-exposure sweeps or incident investigations.
  triage: |
    1. Review the Retrohunt job match list in Google Threat Intelligence and inspect matched string offsets (`$org_domain_acme`, `$secret_private_key`, `$secret_jwt`, `$key_api`) and submission timestamps (`DC0055` File Access, `DC0039` File Creation).
    2. Determine whether the exposed token, certificate private key, or password corresponds to an active ACME Financial cloud service account, internal API gateway, or CI/CD runner rather than a public documentation placeholder.
    3. Audit authentication and cloud access logs (`DC0067` Logon Session Creation) for any API calls or logins made using the leaked credential since the file's `first_submission_date` on VirusTotal.
  response: |
    1. Immediately revoke and rotate any active API key, OAuth/JWT signing secret, database password, or X.509 private key discovered in the Retrohunt match (`M1027` Password Policies, `M1047` Audit).
    2. Identify the workstation or repository from which the file was uploaded, enforce secret-scanning pre-commit hooks, and restrict file permissions on credential stores (`M1022` Restrict File and Directory Permissions, `M1057` Data Loss Prevention).
    3. Scope a targeted retrospective SIEM hunt across ACME Financial logs for all actions performed by the compromised identity prior to rotation.

tests:
  - id: "match_leaked_acme_script_with_api_key"
    description: "Python script under 5MB containing acme.com and an API key assignment triggers a match"
    expect: 1
    events:
      - timestamp: "2026-10-15T12:00:00Z"
        payload:
          filesize: 40960
          vt.metadata.file_type: "vt.FileType.PYTHON"
          vt.metadata.analysis_stats.undetected: 58
          sample_text: "ENDPOINT = 'https://api.acme.com/v1/payments'\napi_key = 'SYNTHETIC_TEST_ACME_API_KEY_000000'"
  - id: "ignore_unbranded_script_without_acme_reference"
    description: "Script containing secret keywords but no reference to acme or acme.com does not match"
    expect: 0
    events:
      - timestamp: "2026-10-15T12:05:00Z"
        payload:
          filesize: 40960
          vt.metadata.file_type: "vt.FileType.PYTHON"
          vt.metadata.analysis_stats.undetected: 58
          sample_text: "ENDPOINT = 'https://api.example.com/v1'\napi_key = 'SYNTHETIC_TEST_OTHER_API_KEY_000000'"
