metadata:
  id: "8f14e45f-ceea-467a-a124-000000000002"
  name: "lh_rogue_ssl_certificate_brand_impersonated"
  description: "Matches external domains presenting X.509 SSL/TLS certificates spoofing ACME Financial in Subject or SAN"
  owners:
    - "Joe Lopes"
  mitre:
    resource-development:
      - "T1587.003"
    stealth:
      - "T1036.005"
  tags:
    - "acme"
    - "phishing"
    - "tls"
    - "x509"
  references:
    - "https://gtidocs.virustotal.com/docs/domain-object"

logic: |
  import "vt"

  condition:
    // Gatekeeper: newly observed external domain with a GTI malicious/suspicious verdict or AV detection
    vt.net.domain.new_domain and
    vt.net.domain.root != "acme.com" and
    (
      (
        defined vt.net.domain.gti_assessment.verdict.value and
        (
          vt.net.domain.gti_assessment.verdict.value == vt.GtiVerdict.VERDICT_MALICIOUS or
          vt.net.domain.gti_assessment.verdict.value == vt.GtiVerdict.VERDICT_SUSPICIOUS
        )
      ) or
      (defined vt.net.domain.analysis_stats.malicious and vt.net.domain.analysis_stats.malicious >= 1)
    ) and
    defined vt.net.domain.https_certificate.subject.common_name and
    (
      // Match lookalike domain names or X.509 certificate Subject CN / Org + SAN spoofing ACME
      vt.net.domain.raw matches /\bacme\b/i or
      vt.net.domain.https_certificate.subject.common_name matches /\bacme\b/i or
      (
        vt.net.domain.https_certificate.subject.organization matches /\bacme\b/i and
        for any name in vt.net.domain.https_certificate.subject_alternative_name : (
          name == vt.net.domain.raw
        )
      )
    )

deployment:
  type: "livehunt"
  subtype: "domain"
  enabled: false
  daily_limit: 100

runbook:
  context: |
    Before launching credential-harvesting or Adversary-in-the-Middle (AiTM) phishing campaigns against ACME Financial (`acme.com`) customers and employees, threat actors (`G0016` APT29, `G0032` Lazarus Group, and financial phishing operators) provision X.509 SSL/TLS certificates (`T1587.003`) for lookalike domains (`T1036.005`) so browsers render a trusted HTTPS padlock. This `subtype: "domain"` Livehunt rule inspects newly observed external domains (`vt.net.domain.new_domain` and `vt.net.domain.root != "acme.com"`) carrying a GTI Malicious/Suspicious verdict (`VERDICT_MALICIOUS` or `VERDICT_SUSPICIOUS`) or AV detection (`analysis_stats.malicious >= 1`) whose HTTPS certificate (`vt.net.domain.https_certificate`) contains `"acme"` as a word boundary in `subject.common_name`, `vt.net.domain.raw`, or `subject.organization` correlated with `subject_alternative_name`. Requiring a threat verdict gatekeeper and SAN correlation prevents broad noise across benign Let's Encrypt ACME protocol subdomains and multi-tenant CDN certificates.
  triage: |
    1. Inspect `vt.net.domain.raw`, `vt.net.domain.root`, `vt.net.domain.gti_assessment`, and the full X.509 certificate details (`https_certificate.subject.common_name`, `subject.organization`, `issuer`, `subject_alternative_name`, and serial number) in Google Threat Intelligence.
    2. Check passive DNS (`A`, `AAAA`, `CNAME`, `MX` records), WHOIS registration date, and ASN hosting provider to determine whether the domain is newly staged adversary infrastructure or an authorized ACME vendor domain.
    3. Query ACME Financial's email gateway, DNS resolver logs, and proxy telemetry (`DC0078` Network Traffic Flow, `DC0082` Network Connection Creation) for any inbound messages or outbound connections referencing `vt.net.domain.raw`.
  response: |
    1. Preemptively block the rogue domain (`vt.net.domain.root` and `vt.net.domain.raw`) across ACME Financial's DNS resolvers, secure web gateway, and inbound email perimeter (`M1021` Restrict Web-Based Content).
    2. Submit certificate revocation and abuse takedown requests to the issuing Certificate Authority (CA), domain registrar, and hosting ASN.
    3. If any ACME employee or customer accessed the domain, invalidate active SSO/banking sessions and enforce FIDO2/WebAuthn phishing-resistant MFA (`M1032` Multi-factor Authentication).

tests:
  - id: "match_rogue_domain_with_acme_ssl_common_name"
    description: "Newly observed malicious external domain presenting an HTTPS certificate with ACME in Subject Common Name triggers a match"
    expect: 1
    events:
      - timestamp: "2026-10-15T12:00:00Z"
        payload:
          vt.net.domain.new_domain: true
          vt.net.domain.root: "login-acme-wealth.test"
          vt.net.domain.raw: "sso.login-acme-wealth.test"
          vt.net.domain.gti_assessment.verdict.value: "vt.GtiVerdict.VERDICT_MALICIOUS"
          vt.net.domain.https_certificate.subject.common_name: "sso.acme.com"
          vt.net.domain.https_certificate.subject.organization: "ACME Financial Corp"
          vt.net.domain.https_certificate.subject_alternative_name:
            - "sso.login-acme-wealth.test"
  - id: "ignore_sanctioned_acme_corporate_root_domain"
    description: "Certificate presented by a subdomain of the sanctioned acme.com root domain is excluded"
    expect: 0
    events:
      - timestamp: "2026-10-15T12:05:00Z"
        payload:
          vt.net.domain.new_domain: true
          vt.net.domain.root: "acme.com"
          vt.net.domain.raw: "sso.acme.com"
          vt.net.domain.gti_assessment.verdict.value: "vt.GtiVerdict.VERDICT_MALICIOUS"
          vt.net.domain.https_certificate.subject.common_name: "sso.acme.com"
          vt.net.domain.https_certificate.subject.organization: "ACME Financial Corp"
          vt.net.domain.https_certificate.subject_alternative_name:
            - "sso.acme.com"
  - id: "ignore_benign_external_domain_without_threat_verdict"
    description: "Benign external domain lacking a GTI malicious/suspicious verdict or AV detection is excluded"
    expect: 0
    events:
      - timestamp: "2026-10-15T12:10:00Z"
        payload:
          vt.net.domain.new_domain: true
          vt.net.domain.root: "acme-staging.example.org"
          vt.net.domain.raw: "acme-staging.example.org"
          vt.net.domain.gti_assessment.verdict.value: "vt.GtiVerdict.VERDICT_HARMLESS"
          vt.net.domain.analysis_stats.malicious: 0
          vt.net.domain.https_certificate.subject.common_name: "acme-staging.example.org"
          vt.net.domain.https_certificate.subject.organization: "Example Org"
          vt.net.domain.https_certificate.subject_alternative_name:
            - "acme-staging.example.org"
