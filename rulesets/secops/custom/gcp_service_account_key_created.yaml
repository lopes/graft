metadata:
  id: "d5e2a481-7f32-4019-86c2-19e34b719002"
  name: "gcp_service_account_key_created"
  description: "User-managed GCP service account key created."
  owners:
    - "Joe Lopes"
  mitre:
    persistence:
      - "T1098.001"
    privilege-escalation:
      - "T1098.001"
  tags:
    - "gcp"
    - "iam"
  references:
    - "https://github.com/chronicle/detection-rules/blob/main/rules/community/gcp/google_cloud_service_account_key_created_or_uploaded.yaral"

logic: |
  events:
    $e.metadata.event_type = "USER_RESOURCE_CREATION"
    $e.metadata.log_type = "GCP_CLOUDAUDIT"
    (
      $e.metadata.product_event_type = "google.iam.admin.v1.CreateServiceAccountKey" or
      $e.metadata.product_event_type = "google.iam.admin.v1.UploadServiceAccountKey"
    )
    $e.security_result.action = "ALLOW"

  outcome:
    $principal_user = $e.principal.user.userid
    $principal_ip = array_distinct($e.principal.ip)
    $target_service_account = $e.target.resource.name
    $method = $e.metadata.product_event_type

  condition:
    $e

deployment:
  enabled: true
  alerting: true
  run_frequency: "live"

runbook:
  context: "Service account keys are downloadable private key pairs providing persistent programmatic access to Google Cloud APIs. Compromised principals or malicious insiders frequently create or upload service account keys to bypass identity provider MFA and maintain unmonitored persistence outside corporate network perimeter."
  triage: |
    1. Identify the caller principal creating or uploading the key and originating IP address.
    2. Review the target service account and its assigned IAM roles.
    3. Check corresponding change management tickets for authorized key generation.
    4. Verify if organization policy constraints/iam.disableServiceAccountKeyCreation and constraints/iam.disableServiceAccountKeyUpload are enforced.
  response: |
    1. Invalidate and delete the created or uploaded service account key immediately.
    2. Rotate credentials for the calling identity if unauthorized activity is suspected.
    3. Audit Cloud Audit Logs for any API actions performed using the newly created key ID.

# EXPERIMENTAL - NOT WORKING
tests:
  - id: "match_service_account_key_creation"
    description: "Fires an alert when a user-managed service account key is created"
    expect: 1
    events:
      - timestamp: "2026-09-17T15:00:00Z"
        payload:
          metadata:
            event_type: "USER_RESOURCE_CREATION"
            log_type: "GCP_CLOUDAUDIT"
            product_name: "Google Cloud IAM"
            product_event_type: "google.iam.admin.v1.CreateServiceAccountKey"
          principal:
            user:
              userid: "dev-operator@corp.example.com"
          target:
            resource:
              name: "projects/corp-prod/serviceAccounts/deployer@corp-prod.iam.gserviceaccount.com"
          security_result:
            action: "ALLOW"

  - id: "ignore_service_account_listing"
    description: "Verifies no alert fires on read-only service account queries"
    expect: 0
    events:
      - timestamp: "2026-09-17T15:05:00Z"
        payload:
          metadata:
            event_type: "USER_RESOURCE_ACCESS"
            log_type: "GCP_CLOUDAUDIT"
            product_name: "Google Cloud IAM"
            product_event_type: "google.iam.admin.v1.ListServiceAccounts"
          principal:
            user:
              userid: "auditor@corp.example.com"
          security_result:
            action: "ALLOW"
